# CyberPower CP550SLG (550VA/330W): HID UPS on usbhid-ups. Pinning the
# CyberPower vendor id (0764) keeps the driver off any other USB HID device.
# lsusb calls this "CP1500 AVR UPS" — that's the usb.ids label for pid 0501,
# which CyberPower reuses across the range, not the actual model.
[cyberpower]
  driver = usbhid-ups
  port = auto
  vendorid = 0764
