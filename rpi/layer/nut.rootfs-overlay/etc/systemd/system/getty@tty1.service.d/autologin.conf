# Physical access already means root here — the SD card is unencrypted and
# cmdline.txt is on a FAT partition anyone can edit. Autologin doesn't lower
# that bar, it just makes recovery possible without a password, which would
# otherwise have to be a real secret in a public repo.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin core --noclear %I $TERM
