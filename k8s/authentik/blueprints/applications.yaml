version: 1
metadata:
  name: Tale - Applications
context:
  oauth2_defaults: &oauth2-defaults
    client_type: confidential
    include_claims_in_id_token: true
    sub_mode: hashed_user_id
    signing_key:
      !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
    authorization_flow:
      !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    property_mappings:
      - !Find [
          authentik_providers_oauth2.scopemapping,
          [managed, goauthentik.io/providers/oauth2/scope-openid],
        ]
      - !Find [
          authentik_providers_oauth2.scopemapping,
          [managed, goauthentik.io/providers/oauth2/scope-email],
        ]
      - !Find [
          authentik_providers_oauth2.scopemapping,
          [managed, goauthentik.io/providers/oauth2/scope-profile],
        ]
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: flux-provider
    identifiers:
      client_id: 6VoYqXzcFTThzCT4QlxQAii4be1Z0vAck8yarWAq
    attrs:
      <<: *oauth2-defaults
      client_secret: !Env AUTHENTIK_OIDC_SECRET_FLUX
      name: Provider for Flux
      redirect_uris:
        - matching_mode: strict
          url: https://flux.tale.me/oauth2/callback

  - model: authentik_core.application
    id: flux-app
    identifiers:
      slug: flux
    attrs:
      name: Flux
      provider: !KeyOf flux-provider

  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf flux-app
      group: !Find [authentik_core.group, [name, Homelab Superadmins]]

  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      client_id: 23dwmTqKfdjbQ027aYufmGoYJFBrcCBCBSabnZgS
    attrs:
      <<: *oauth2-defaults
      client_secret: !Env AUTHENTIK_OIDC_SECRET_GRAFANA
      name: Provider for Grafana
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.tale.me/login/generic_oauth
        - matching_mode: strict
          url: http://localhost:3000/login/generic_oauth

  - model: authentik_core.application
    id: grafana-app
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider

  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf grafana-app
      group: !Find [authentik_core.group, [name, Homelab Superadmins]]

  - model: authentik_providers_oauth2.oauth2provider
    id: headplane-provider
    identifiers:
      client_id: CORbjQR4NF5Fy6BFqDuR5Sca2Q9Hr2zszLr9Mh4r
    attrs:
      <<: *oauth2-defaults
      client_secret: !Env AUTHENTIK_OIDC_SECRET_HEADPLANE
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      name: Provider for Headplane
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/admin/oidc/callback

  - model: authentik_core.application
    id: headplane-app
    identifiers:
      slug: headplane
    attrs:
      name: Headplane
      provider: !KeyOf headplane-provider

  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf headplane-app
      group: !Find [authentik_core.group, [name, Homelab Superadmins]]

  - model: authentik_providers_oauth2.oauth2provider
    id: forgejo-provider
    identifiers:
      client_id: M0bUdSesfFaBDiP6tTThiUtLzLdnbza0oeU1Cv58
    attrs:
      <<: *oauth2-defaults
      client_secret: !Env AUTHENTIK_OIDC_SECRET_FORGEJO
      name: Provider for Forgejo
      redirect_uris:
        - matching_mode: strict
          url: https://git.tale.me/user/oauth2/Authentik/callback

  - model: authentik_core.application
    id: forgejo-app
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      provider: !KeyOf forgejo-provider

  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf forgejo-app
      group: !Find [authentik_core.group, [name, Homelab Users]]

  - model: authentik_providers_oauth2.oauth2provider
    id: home-assistant-provider
    identifiers:
      client_id: q7BwQZlr4HAhev0FAdJblprxLAtdUSL5aXGphhZI
    attrs:
      <<: *oauth2-defaults
      client_secret: !Env AUTHENTIK_OIDC_SECRET_HOME_ASSISTANT
      name: Provider for Home Assistant
      redirect_uris:
        - matching_mode: strict
          url: https://home.tale.me/auth/oidc/callback

  - model: authentik_core.application
    id: home-assistant-app
    identifiers:
      slug: home-assistant
    attrs:
      name: Home Assistant
      provider: !KeyOf home-assistant-provider

  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf home-assistant-app
      group: !Find [authentik_core.group, [name, Homelab Users]]

  - model: authentik_providers_oauth2.oauth2provider
    id: wakatime-provider
    identifiers:
      client_id: Qsd53gAIpvq9Xaq2Q2oD9xHkOxREVYYKhL3xfzyk
    attrs:
      <<: *oauth2-defaults
      client_secret: !Env AUTHENTIK_OIDC_SECRET_WAKAPI
      name: Provider for WakaTime
      redirect_uris:
        - matching_mode: strict
          url: https://wakatime.tale.me/oidc/authentik/callback

  - model: authentik_core.application
    id: wakatime-app
    identifiers:
      slug: waka-time
    attrs:
      name: WakaTime
      provider: !KeyOf wakatime-provider

  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf wakatime-app
      group: !Find [authentik_core.group, [name, Homelab Users]]
