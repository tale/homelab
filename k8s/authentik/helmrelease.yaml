apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: authentik
spec:
  url: https://charts.goauthentik.io
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      version: 2026.5.6
      sourceRef:
        kind: HelmRepository
        name: authentik
  install:
    createNamespace: true
  upgrade:
    serverSideApply: enabled
  rollback:
    serverSideApply: enabled
  values:
    global:
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: db-password
        - name: AUTHENTIK_EMAIL__USERNAME
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: ses-username
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: ses-password
        # Consumed by `!Env` in the oidc-providers blueprint. Rotating any of
        # these means updating the relying party too — for headplane and
        # home-assistant that side is not in this repo, so they cannot be
        # rotated from here alone.
        - name: AUTHENTIK_OIDC_SECRET_FLUX
          valueFrom:
            secretKeyRef:
              name: authentik-oidc-secrets
              key: flux
        - name: AUTHENTIK_OIDC_SECRET_FORGEJO
          valueFrom:
            secretKeyRef:
              name: authentik-oidc-secrets
              key: forgejo
        - name: AUTHENTIK_OIDC_SECRET_GRAFANA
          valueFrom:
            secretKeyRef:
              name: authentik-oidc-secrets
              key: grafana
        - name: AUTHENTIK_OIDC_SECRET_HEADPLANE
          valueFrom:
            secretKeyRef:
              name: authentik-oidc-secrets
              key: headplane
        - name: AUTHENTIK_OIDC_SECRET_HOME_ASSISTANT
          valueFrom:
            secretKeyRef:
              name: authentik-oidc-secrets
              key: home-assistant
        - name: AUTHENTIK_OIDC_SECRET_HUBBLE
          valueFrom:
            secretKeyRef:
              name: authentik-oidc-secrets
              key: hubble
        - name: AUTHENTIK_OIDC_SECRET_WAKAPI
          valueFrom:
            secretKeyRef:
              name: authentik-oidc-secrets
              key: wakapi
    authentik:
      avatars: "gravatar,https://github.com/%(username)s.png,initials"
      log_level: info
      error_reporting:
        enabled: false
      email:
        host: email-smtp.us-east-1.amazonaws.com
        port: 587
        use_tls: true
        use_ssl: false
        from: noreply@tale.me
      postgresql:
        host: central-postgres-rw.cnpg-system.svc.cluster.local
        port: 5432
        name: authentik
        user: app
    blueprints:
      configMaps:
        - authentik-blueprints
    postgresql:
      enabled: false
    redis:
      enabled: true
    server:
      # Must be Recreate: the data PVC is RWO, so a rolling update deadlocks —
      # the new pod cannot attach the volume until the old one releases it, and
      # the old one is not torn down until the new one is ready. The chart key
      # is `deploymentStrategy`; a plain `strategy` block is silently ignored.
      deploymentStrategy:
        type: Recreate
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authentik-data
      volumeMounts:
        - name: data
          mountPath: /data
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
