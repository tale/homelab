apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pds-http-route
  namespace: bluesky-pds
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: envoy-gw
      sectionName: https
      namespace: networking
  hostnames:
    - pds.tale.me
  rules:
    - backendRefs:
        - name: bluesky-pds
          port: 3000
