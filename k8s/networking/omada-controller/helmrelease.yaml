apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omada-controller
  namespace: networking
spec:
  interval: 1h
  chart:
    spec:
      chart: omada-controller-helm
      version: 1.4.1
      sourceRef:
        kind: HelmRepository
        name: mbentley
        namespace: flux-system
  upgrade:
    serverSideApply: enabled
  rollback:
    serverSideApply: enabled
  values:
    config:
      timezone: America/New_York
      externalMongoDBUrlSecret:
        name: omada-mongodb-uri
        key: uri
    service:
      type: LoadBalancer
      annotations:
        metallb.io/address-pool: omada-pool
    persistence:
      data:
        storageClassName: cluster-nvmf
        size: 10Gi
      logs:
        storageClass: cluster-nvmf
        size: 1Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
