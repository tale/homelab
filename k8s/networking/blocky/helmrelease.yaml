apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: networking
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    controllers:
      blocky:
        type: daemonset
        initContainers:
          config-builder:
            image:
              repository: busybox
              tag: "1.36"
            command: ["sh", "-c"]
            args:
              - |
                DB_URI=$(cat /secrets/uri)
                sed "s|__DB_URI__|${DB_URI}|g" /config-template/config.yml > /config/config.yml
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop: ["ALL"]
        containers:
          blocky:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: latest
            env:
              TZ: America/New_York
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  initialDelaySeconds: 5
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop: ["ALL"]
                add: ["NET_BIND_SERVICE"]

      redis:
        type: deployment
        containers:
          redis:
            image:
              repository: redis
              tag: "7"
            args: ["--save", "", "--appendonly", "no"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop: ["ALL"]

    service:
      dns:
        controller: blocky
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          metallb.io/address-pool: blocky-pool
        ports:
          dns-udp:
            port: 53
            targetPort: 53
            protocol: UDP
          dns-tcp:
            port: 53
            targetPort: 53
            protocol: TCP
          dns-tls:
            port: 853
            targetPort: 853
            protocol: TCP
      http:
        controller: blocky
        ports:
          http:
            port: 4000
            targetPort: 4000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
            targetPort: 6379

    persistence:
      config-template:
        type: configMap
        name: blocky-config
        advancedMounts:
          blocky:
            config-builder:
              - path: /config-template
      db-secret:
        type: secret
        name: blocky-db-uri
        advancedMounts:
          blocky:
            config-builder:
              - path: /secrets
      rendered-config:
        type: emptyDir
        advancedMounts:
          blocky:
            config-builder:
              - path: /config
            blocky:
              - path: /app/config.yml
                subPath: config.yml
