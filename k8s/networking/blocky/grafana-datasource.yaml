apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: blocky-postgres
  namespace: networking
spec:
  instanceSelector:
    matchLabels:
      dashboards: "homelab"
  allowCrossNamespaceImport: true
  datasource:
    name: Blocky Postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: central-postgres-rw.cnpg-system.svc.cluster.local:5432
    database: blocky
    user: app
    isDefault: false
    jsonData:
      sslmode: require
    secureJsonData:
      password: "${password}"
  valuesFrom:
    - targetPath: "secureJsonData.password"
      valueFrom:
        secretKeyRef:
          name: blocky-db-credentials
          key: password
