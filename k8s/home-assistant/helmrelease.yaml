apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: home-automation
spec:
  type: oci
  url: oci://ghcr.io/bjw-s-labs/helm
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

    controllers:
      home-assistant:
        type: deployment
        strategy: Recreate
        initContainers:
          bootstrap-config:
            image:
              repository: alpine
              tag: "3.22"
            env:
              LAN_INTERFACE: enp0s31f6
              EUFY_SECURITY_TAG: v8.2.4
              TUYA_LOCAL_TAG: "2026.4.1"
            command: ["sh", "-eu", "-c"]
            args:
              - |
                install_component() {
                  repo=$1
                  component=$2
                  tag=$3
                  installed=/config/custom_components/${component}/.installed_version

                  if [ "$(cat "${installed}" 2>/dev/null)" != "${tag}" ]; then
                    rm -rf /tmp/src
                    mkdir -p /tmp/src
                    wget -qO- "https://github.com/${repo}/archive/refs/tags/${tag}.tar.gz" | tar xz -C /tmp/src
                    rm -rf "/config/custom_components/${component}"
                    mv "/tmp/src/$(basename "${repo}")-${tag#v}/custom_components/${component}" /config/custom_components/
                    echo "${tag}" > "${installed}"
                  fi
                }

                for file in automations.yaml scenes.yaml scripts.yaml; do
                  [ -e "/config/${file}" ] || : > "/config/${file}"
                done

                lan_ip=$(ip -4 -o addr show "${LAN_INTERFACE}" 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
                if [ -z "${lan_ip}" ]; then
                  echo "no IPv4 address on ${LAN_INTERFACE}; HomeKit would advertise an unreachable address" >&2
                  exit 1
                fi
                echo "${lan_ip}" > /config/homekit_host_ip.yaml

                mkdir -p /config/custom_components

                install_component fuatakgun/eufy_security eufy_security "${EUFY_SECURITY_TAG}"
                install_component make-all/tuya-local tuya_local "${TUYA_LOCAL_TAG}"
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              seccompProfile:
                type: RuntimeDefault
        containers:
          home-assistant:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: stable
              pullPolicy: IfNotPresent
            env:
              TZ: America/New_York
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 2
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 80
            targetPort: 8123

    route:
      app:
        hostnames:
          - home.tale.me
        parentRefs:
          - name: envoy-gw
            namespace: default
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80

    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: cluster-nvmf
        retain: true
        advancedMounts:
          home-assistant:
            bootstrap-config:
              - path: /config
            home-assistant:
              - path: /config
      config:
        type: configMap
        name: home-assistant-config
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /config/configuration.yaml
                subPath: configuration.yaml
                readOnly: true
      secrets:
        type: secret
        name: home-assistant-secrets
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /config/secrets.yaml
                subPath: secrets.yaml
                readOnly: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eufy-security-ws
  namespace: home-automation
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

    controllers:
      eufy-security-ws:
        type: deployment
        strategy: Recreate
        containers:
          eufy-security-ws:
            image:
              repository: bropat/eufy-security-ws
              tag: 3.1.0
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: eufy-ws-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: eufy-security-ws
        ports:
          http:
            port: 3000
            targetPort: 3000

    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: cluster-nvmf
        retain: true
        globalMounts:
          - path: /data
---
