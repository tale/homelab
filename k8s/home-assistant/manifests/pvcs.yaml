apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-data
  namespace: home-automation
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: cluster-nvmf
  resources:
    requests:
      storage: 20Gi
