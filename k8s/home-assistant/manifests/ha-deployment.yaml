apiVersion: v1
kind: Namespace
metadata:
  name: home-automation
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-automation
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: bootstrap-config
          image: alpine:3.22
          env:
            - name: EUFY_SECURITY_VERSION
              value: "8.2.4"
          command:
            - sh
            - -eu
            - -c
            - |
              installed=/config/custom_components/eufy_security/.installed_version

              for file in automations.yaml scenes.yaml scripts.yaml; do
                [ -e "/config/$${file}" ] || : > "/config/$${file}"
              done

              mkdir -p /config/custom_components

              if [ "$$(cat "$${installed}" 2>/dev/null)" != "$${EUFY_SECURITY_VERSION}" ]; then
                rm -rf /tmp/src
                mkdir -p /tmp/src
                wget -qO- "https://github.com/fuatakgun/eufy_security/archive/refs/tags/v$${EUFY_SECURITY_VERSION}.tar.gz" | tar xz -C /tmp/src
                rm -rf /config/custom_components/eufy_security
                mv "/tmp/src/eufy_security-$${EUFY_SECURITY_VERSION}/custom_components/eufy_security" /config/custom_components/
                echo "$${EUFY_SECURITY_VERSION}" > "$${installed}"
              fi
          volumeMounts:
            - name: data
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: data
              mountPath: /config
            - name: ha-config
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: ha-secrets
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
          ports:
            - name: ui
              containerPort: 8123
              protocol: TCP
          livenessProbe:
            httpGet:
              path: "/"
              port: 8123
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: "/"
              port: 8123
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: home-assistant-data
        - name: ha-config
          configMap:
            name: home-assistant-config
        - name: ha-secrets
          secret:
            secretName: home-assistant-secrets
            items:
              - key: secrets.yaml
                path: secrets.yaml
