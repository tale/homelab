apiVersion: "v1"
kind: "Secret"
metadata:
  name: "vanilla-restic"
  namespace: "minecraft"
stringData:
  RESTIC_REPOSITORY: "s3:https://${B2_ENDPOINT}/${B2_BUCKET}/volsync/minecraft-vanilla"
  RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
  AWS_ACCESS_KEY_ID: "${B2_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${B2_APP_KEY}"
