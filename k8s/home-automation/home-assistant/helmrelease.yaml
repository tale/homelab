apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    controllers:
      home-assistant:
        type: deployment
        strategy: Recreate
        initContainers:
          bootstrap-config:
            image:
              repository: alpine
              tag: "3.22"
            env:
              LAN_INTERFACE: enp0s31f6
              EUFY_SECURITY_REF: v8.2.4
              TUYA_LOCAL_REF: 2026.4.1
              HA_SCRYPTED_REF: d97c417843c33341d0eb2ddd5326c6ebf58d36b4
              DISABLED_ENTITY_MATCHES: T8113N632105314A T8113N6321053916
            command:
              - sh
              - -eu
              - -c
            args:
              - "install_component() {\n  repo=$1\n  component=$2\n  ref=$3\n  installed=/config/custom_components/${component}/.installed_version\n\n  if [ \"$(cat \"${installed}\" 2>/dev/null)\" != \"${ref}\" ]; then\n    rm -rf /tmp/src\n    mkdir -p /tmp/src\n    wget -qO- \"https://github.com/${repo}/archive/${ref}.tar.gz\" | tar xz -C /tmp/src\n    rm -rf \"/config/custom_components/${component}\"\n    mv \"/tmp/src/$(basename \"${repo}\")-${ref#v}/custom_components/${component}\" /config/custom_components/\n    echo \"${ref}\" > \"${installed}\"\n  fi\n}\n\nfor file in automations.yaml scenes.yaml scripts.yaml; do\n  [ -e \"/config/${file}\" ] || : > \"/config/${file}\"\ndone\n\nlan_ip=$(ip -4 -o addr show \"${LAN_INTERFACE}\" 2>/dev/null | awk '{print $4}' | cut -d/ -f1)\nif [ -z \"${lan_ip}\" ]; then\n  echo \"no IPv4 address on ${LAN_INTERFACE}; HomeKit would advertise an unreachable address\" >&2\n  exit 1\nfi\necho \"${lan_ip}\" > /config/homekit_host_ip.yaml\n\nmkdir -p /config/custom_components\n\ninstall_component fuatakgun/eufy_security eufy_security \"${EUFY_SECURITY_REF}\"\ninstall_component make-all/tuya-local tuya_local \"${TUYA_LOCAL_REF}\"\ninstall_component koush/ha_scrypted scrypted \"${HA_SCRYPTED_REF}\"\nmkdir -p /config/packages\n\nif grep -qE '\"domain\":[[:space:]]*\"scrypted\"' /config/.storage/core.config_entries 2>/dev/null; then\n  rm -f /config/packages/scrypted.yaml\nelse\n  cat > /config/packages/scrypted.yaml <<'PKG'\nscrypted:\n  name: Scrypted\n  icon: mdi:cctv\n  host: scrypted.home-automation.svc.cluster.local:443\n  username: !secret scrypted_username\n  password: !secret scrypted_password\nPKG\nfi\n\nregistry=/config/.storage/core.entity_registry\nif [ -f \"${registry}\" ]; then\n  for match in ${DISABLED_ENTITY_MATCHES}; do\n    sed -i \"/${match}/ s/\\\"disabled_by\\\":null/\\\"disabled_by\\\":\\\"user\\\"/g\" \"${registry}\"\n  done\nfi\n"
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              seccompProfile:
                type: RuntimeDefault
        containers:
          home-assistant:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.8.2"
              pullPolicy: IfNotPresent
            env:
              TZ: America/New_York
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 2
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 80
            targetPort: 8123
    route:
      app:
        hostnames:
          - home.tale.me
        parentRefs:
          - name: envoy-gw
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: cluster-nvmf
        retain: true
        advancedMounts:
          home-assistant:
            bootstrap-config:
              - path: /config
            home-assistant:
              - path: /config
      config:
        type: configMap
        name: home-assistant-config
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /config/configuration.yaml
                subPath: configuration.yaml
                readOnly: true
              - path: /config/ui-lovelace.yaml
                subPath: ui-lovelace.yaml
                readOnly: true
      secrets:
        type: secret
        name: home-assistant-secrets
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /config/secrets.yaml
                subPath: secrets.yaml
                readOnly: true
