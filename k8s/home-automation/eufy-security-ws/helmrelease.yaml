apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eufy-security-ws
  namespace: home-automation
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    controllers:
      eufy-security-ws:
        type: deployment
        strategy: Recreate
        containers:
          eufy-security-ws:
            image:
              repository: bropat/eufy-security-ws
              tag: 3.1.0
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: eufy-ws-secrets
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: eufy-security-ws
        ports:
          http:
            port: 3000
            targetPort: 3000
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: cluster-nvmf
        retain: true
        globalMounts:
          - path: /data
