apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrypted
  namespace: home-automation
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    controllers:
      scrypted:
        type: deployment
        strategy: Recreate
        initContainers:
          seed-user:
            image:
              repository: ghcr.io/koush/scrypted
              tag: latest
              pullPolicy: IfNotPresent
            env:
              NODE_PATH: /server/node_modules
              SEED_DB: /server/volume/scrypted.db
              SEED_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secrets
                    key: scrypted_username
              SEED_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secrets
                    key: scrypted_password
            command:
              - sh
              - -eu
              - -c
            args:
              - |
                cat > /tmp/seed.js <<'JS'
                const { Level } = require("level");
                const crypto = require("crypto");

                const sha256 = (value) => crypto.createHash("sha256").update(value).digest().toString("hex");

                (async () => {
                  const username = process.env.SEED_USERNAME;
                  const password = process.env.SEED_PASSWORD;
                  const db = new Level(process.env.SEED_DB);
                  await db.open();
                  const key = `ScryptedUser/${username}`;

                  let existing;
                  try {
                    existing = JSON.parse(await db.get(key));
                  } catch (e) {}

                  if (existing && sha256(existing.salt + password) === existing.passwordHash) {
                    await db.close();
                    return;
                  }

                  const salt = crypto.randomBytes(64).toString("base64");
                  await db.put(key, JSON.stringify({
                    _id: username,
                    _documentType: "ScryptedUser",
                    salt,
                    passwordHash: sha256(salt + password),
                    passwordDate: Date.now(),
                    token: existing?.token || crypto.randomBytes(16).toString("hex"),
                  }));
                  await db.close();
                })();
                JS
                node /tmp/seed.js
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              seccompProfile:
                type: RuntimeDefault
        containers:
          scrypted:
            image:
              repository: ghcr.io/koush/scrypted
              tag: latest
              pullPolicy: IfNotPresent
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 11080
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 11080
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 2
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: scrypted
        ports:
          https:
            port: 443
            targetPort: 10443
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: cluster-nvmf
        retain: true
        globalMounts:
          - path: /server/volume
