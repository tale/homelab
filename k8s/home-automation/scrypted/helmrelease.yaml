apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrypted
  namespace: home-automation
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    controllers:
      scrypted:
        type: deployment
        strategy: Recreate
        containers:
          scrypted:
            image:
              repository: ghcr.io/koush/scrypted
              tag: latest
              pullPolicy: IfNotPresent
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 11080
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 11080
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 2
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: scrypted
        ports:
          https:
            port: 443
            targetPort: 10443
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: cluster-nvmf
        retain: true
        globalMounts:
          - path: /server/volume
