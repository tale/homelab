apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: devtools
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault

    controllers:
      gitlab:
        type: deployment
        strategy: Recreate
        containers:
          gitlab:
            image:
              repository: docker.io/gitlab/gitlab-ce
              tag: 19.3.1-ce.0
              pullPolicy: IfNotPresent
            env:
              GITLAB_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: gitlab-root-password
                    key: password
              GITLAB_OMNIBUS_CONFIG: |
                external_url 'https://gitlab.tale.me'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                nginx['proxy_set_headers'] = { 'X-Forwarded-Proto' => 'https', 'X-Forwarded-Ssl' => 'on' }
                letsencrypt['enable'] = false
                registry['enable'] = false
                gitlab_kas['enable'] = false
                gitlab_pages['enable'] = false
                prometheus_monitoring['enable'] = false
                puma['worker_processes'] = 2
                sidekiq['max_concurrency'] = 9
                postgresql['shared_buffers'] = '256MB'
                gitlab_rails['gitlab_shell_ssh_port'] = 22
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/health
                    port: 80
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/health
                    port: 80
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/readiness
                    port: 80
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                cpu: "1"
                memory: 4Gi
              limits:
                memory: 8Gi

    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: cluster-nvmf-ephemeral
        accessMode: ReadWriteOnce
        size: 30Gi
        globalMounts:
          - path: /etc/gitlab
            subPath: config
          - path: /var/opt/gitlab
            subPath: data
          - path: /var/log/gitlab
            subPath: logs
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        globalMounts:
          - path: /dev/shm

    service:
      app:
        controller: gitlab
        ports:
          http:
            port: 80
            targetPort: 80

    route:
      app:
        hostnames:
          - gitlab.tale.me
        parentRefs:
          - name: envoy-gw
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80
            timeouts:
              request: 300s
              backendRequest: 300s
