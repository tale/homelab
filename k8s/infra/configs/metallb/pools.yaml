apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: blocky-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 10.0.0.225/32
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: samba-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 10.0.0.230/32
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: minecraft-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 10.0.0.235/32
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: omada-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 10.0.0.240/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - blocky-pool
    - samba-pool
    - minecraft-pool
    - omada-pool
