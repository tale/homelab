apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: central-postgres
  namespace: cnpg-system
spec:
  instances: 2
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
  storage:
    storageClass: cluster-nvmf
    size: 50Gi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    recovery:
      source: central-postgres-archive
  externalClusters:
    - name: central-postgres-archive
      barmanObjectStore:
        serverName: central-postgres-r1
        destinationPath: s3://${B2_BUCKET}/cnpg/
        endpointURL: https://${B2_ENDPOINT}
        s3Credentials:
          accessKeyId:
            name: cnpg-b2-credentials
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: cnpg-b2-credentials
            key: ACCESS_SECRET_KEY
        wal:
          compression: gzip
  backup:
    barmanObjectStore:
      serverName: central-postgres-r1
      destinationPath: s3://${B2_BUCKET}/cnpg/
      endpointURL: https://${B2_ENDPOINT}
      s3Credentials:
        accessKeyId:
          name: cnpg-b2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-b2-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
