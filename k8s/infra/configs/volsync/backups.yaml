apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: volsync-backups
  namespace: flux-system
spec:
  inputs:
    - app: bluesky-pds
      namespace: bluesky-pds
      pvc: bluesky-pds-data
      repository: bluesky-pds
      schedule: "0 3 * * *"
      cacheCapacity: 1Gi
      copyMethod: Snapshot

    - app: home-assistant
      namespace: home-automation
      pvc: home-assistant
      repository: home-assistant
      schedule: "15 3 * * *"
      cacheCapacity: 2Gi
      copyMethod: Snapshot

    - app: eufy-security-ws
      namespace: home-automation
      pvc: eufy-security-ws
      repository: eufy-security-ws
      schedule: "30 3 * * *"
      cacheCapacity: 1Gi
      copyMethod: Snapshot

    - app: scrypted
      namespace: home-automation
      pvc: scrypted
      repository: scrypted
      schedule: "45 3 * * *"
      cacheCapacity: 1Gi
      copyMethod: Snapshot

    - app: vanilla-backups
      namespace: minecraft
      pvc: vanilla-backups
      repository: minecraft-vanilla
      schedule: "0 4 * * *"
      cacheCapacity: 2Gi
      copyMethod: Snapshot

    - app: omada-mongodb
      namespace: networking
      pvc: omada-mongodb-dump
      repository: omada-mongodb
      schedule: "30 2 * * *"
      cacheCapacity: 1Gi
      copyMethod: Snapshot

    - app: omada-controller-data
      namespace: networking
      pvc: data-omada-controller-0
      repository: omada-controller
      schedule: "45 2 * * *"
      cacheCapacity: 2Gi
      copyMethod: Snapshot

    - app: smb-store
      namespace: home-automation
      pvc: samba
      repository: smb-store
      schedule: "0 5 * * *"
      cacheCapacity: 4Gi
      copyMethod: Direct
  resources:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: << inputs.app >>-restic
        namespace: << inputs.namespace >>
      stringData:
        RESTIC_REPOSITORY: s3:https://${B2_ENDPOINT}/${B2_BUCKET}/volsync/<< inputs.repository >>
        RESTIC_PASSWORD: ${RESTIC_PASSWORD}
        AWS_ACCESS_KEY_ID: ${B2_KEY_ID}
        AWS_SECRET_ACCESS_KEY: ${B2_APP_KEY}
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      metadata:
        name: << inputs.app >>
        namespace: << inputs.namespace >>
      spec:
        sourcePVC: << inputs.pvc >>
        trigger:
          schedule: << inputs.schedule | quote >>
        restic:
          repository: << inputs.app >>-restic
          cacheCapacity: << inputs.cacheCapacity | quote >>
          copyMethod: << inputs.copyMethod >>
          volumeSnapshotClassName: cluster-nvmf-snapshot
          storageClassName: cluster-nvmf-ephemeral
          cacheStorageClassName: cluster-nvmf-ephemeral
          pruneIntervalDays: 14
          retain:
            daily: 7
            weekly: 5
            monthly: 6
