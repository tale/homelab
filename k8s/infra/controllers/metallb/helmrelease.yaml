apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb
  upgrade:
    serverSideApply: enabled
  rollback:
    serverSideApply: enabled
  values:
    prometheus:
      rbacPrometheus: false
      serviceMonitor:
        enabled: false
    # 0.16 makes frr-k8s the default BGP backend and ships it as a DaemonSet on
    # every node. We advertise over L2 only and have no BGP peers, so it is
    # dead weight.
    frrk8s:
      enabled: false
