apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: metallb-controller
  namespace: metallb-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: metallb
  podMetricsEndpoints:
    - port: metricshttps
      path: /metrics
      interval: 30s
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      # 0.16 dropped kube-rbac-proxy for a native TLS endpoint that also
      # authenticates. vmagent's ClusterRole already covers the /metrics
      # nonResourceURL, it just has to present the token.
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
---
