apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1h
  chart:
    spec:
      chart: gateway-helm
      version: v1.8.3
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
  install:
    createNamespace: true
  upgrade:
    serverSideApply: enabled
    # 1.8 requires the Gateway API CRDs at v1.5.1 and the chart ships them in a
    # crds/ directory, which Helm ignores on upgrade. Without this they stay at
    # v1.4.1 and the controller watches ListenerSet against the wrong schema.
    crds: CreateReplace
  rollback:
    serverSideApply: enabled
  values:
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
        telemetry:
          metrics:
            prometheus:
              disable: false
    deployment:
      replicas: 2
