apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  interval: 1h
  chart:
    spec:
      chart: volsync
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: backube
  install:
    createNamespace: true
  upgrade:
    serverSideApply: enabled
  rollback:
    serverSideApply: enabled
  values:
    metrics:
      disableAuth: true
