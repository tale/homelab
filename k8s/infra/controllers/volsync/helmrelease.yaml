# Backs arbitrary PVCs up to S3 with restic. Postgres is already covered by
# barman, so this exists for the volumes nothing else protects — the PDS being the
# one whose loss is unrecoverable.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  interval: 1h
  chart:
    spec:
      chart: volsync
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: backube
  install:
    createNamespace: true
  upgrade:
    serverSideApply: enabled
  rollback:
    serverSideApply: enabled
  values:
    metrics:
      # The chart ships its own ServiceMonitor whenever that CRD is present, and
      # it is now, so the converter picks this up with no extra config. Its
      # endpoint carries no bearer token though, so the scrape only works with
      # authn off. What leaks is backup timings and counts, cluster-internal.
      disableAuth: true
