apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 1h
  chart:
    spec:
      chart: openebs
      version: 4.5.1
      sourceRef:
        kind: HelmRepository
        name: openebs
  install:
    createNamespace: true
  upgrade:
    serverSideApply: enabled
  rollback:
    serverSideApply: enabled
  # io-engine is OnDelete on purpose: its restarts are sequenced by
  # kubectl-openebs, not by the DaemonSet controller. kstatus counts that as
  # InProgress forever because updatedNumberScheduled never catches up, so
  # judge readiness instead.
  healthCheckExprs:
    - apiVersion: apps/v1
      kind: DaemonSet
      current: status.numberReady == status.desiredNumberScheduled
  values:
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: true
    monitoring:
      enabled: true
    mayastor:
      io_engine:
        envcontext: "iova-mode=pa"
      csi:
        node:
          initContainers:
            enabled: false
