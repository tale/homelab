apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-image-renderer
  namespace: observability-system
  labels:
    app.kubernetes.io/name: grafana-image-renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-image-renderer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-image-renderer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: renderer
          image: grafana/grafana-image-renderer:v5.10.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: HTTP_PORT
              value: "8081"
            - name: ENABLE_METRICS
              value: "true"
            - name: RENDERING_MODE
              value: clustered
            - name: RENDERING_CLUSTERING_MODE
              value: browser
            - name: RENDERING_CLUSTERING_MAX_CONCURRENCY
              value: "3"
            - name: RENDERING_VERBOSE_LOGGING
              value: "false"
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-renderer-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-image-renderer
  namespace: observability-system
  labels:
    app.kubernetes.io/name: grafana-image-renderer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-image-renderer
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: grafana-image-renderer
  namespace: observability-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-image-renderer
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
