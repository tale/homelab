apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vmagent-config-reloader
  namespace: observability-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vmagent-config-reloader
  namespace: observability-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vmagent-config-reloader
subjects:
  - kind: ServiceAccount
    name: vmagent-victoria-metrics-k8s-stack
    namespace: observability-system
