# Hand-written: nothing on grafana.com covers this shape — Envoy Gateway, Blocky
# and CoreDNS on one screen, which is what "did the request get in, and did the
# name resolve" actually needs.
#
# The gateway panels read the Envoy *data plane*, which went unscraped until the
# VMPodScrape in k8s/infra/configs/envoy/service-monitor.yaml existed. Two
# details that are not obvious from the metric names:
#
#   - `https-10443` is the only conn_manager prefix carrying real traffic. The
#     others (`admin`, `eg-ready-http`, `eg-stats-http`) are Envoy's own
#     endpoints and would triple every rate if left in.
#   - `envoy_cluster_name` is `httproute/<namespace>/<route>/rule/<n>`, so
#     grouping by it gives one series per service behind the gateway.
#
# Blocky is the LAN resolver and CoreDNS is the cluster one. They answer
# different questions and are deliberately not summed together.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ingress-dns
  namespace: observability-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: "homelab"
  folder: Infrastructure
  resyncPeriod: 10m
  json: |
