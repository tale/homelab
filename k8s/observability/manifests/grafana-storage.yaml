                  {
                    "color": "#0ca30c",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 70
                  },
                  {
                    "color": "#ec835a",
                    "value": 85
                  },
                  {
                    "color": "#d03b3b",
                    "value": 93
                  }
                ]
