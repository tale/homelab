apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: storage-backups
  namespace: observability-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: "homelab"
  folder: Homelab
  resyncPeriod: 10m
  json: |
    {
      "uid": "homelab-storage",
      "title": "Storage & Backups",
      "tags": [
        "homelab",
        "storage"
      ],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "links": [
        {
          "title": "Overview",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-overview",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Postgres",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-postgres",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Kubernetes",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-kubernetes",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        }
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Capacity",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pools Online",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(diskpool_status == 1) or vector(0)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#ec835a",
                    "value": 2
                  },
                  {
                    "color": "#0ca30c",
                    "value": 3
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Mayastor Nodes",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (node_id) (mayastor_node_online))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#ec835a",
                    "value": 2
                  },
                  {
                    "color": "#0ca30c",
                    "value": 3
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "description": "A cordoned or draining node still reports online; check the storage control plane if this disagrees with node readiness."
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pool I/O Errors",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (name) (diskpool_io_error_count))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  },
                  {
                    "color": "#d03b3b",
                    "value": 1
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "description": "Cumulative since the pool came up. Watch the slope \u2014 a climbing count is a disk on its way out."
        },
