# Serves the PNG embedded in the repo README at
# https://grafana.tale.me/live/homelab.png.
#
# GitHub proxies README images through camo, which caches them, so this is
# fresh-ish rather than live — expect minutes-to-hours of lag and no way to force
# a purge. A five-minute refresh is already finer-grained than camo will honour;
# it is that often only so the file is never very stale when camo does revalidate.
#
# 2200x805 is a deliberate crop, not a whole-board capture. Grafana's grid is
# proportional, so rendering wider does not change what is shown — it just makes
# a squat, banner-shaped image instead of a tall one that swallows the README.
# 805px lands just above the Ingress row header: the twelve stat tiles and the
# four graphs below them, with no panel sliced in half. Changing the row order on
# the public board means re-measuring this.
#
# What is deliberately *not* here: no Grafana credentials. The refresher renders
# the public dashboard, which needs no auth to load, so the only secret involved
# is the renderer's own token — and the renderer is ClusterIP with no route
# precisely because it will render any URL it is handed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-live-image-nginx
  namespace: observability-system
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      # The route strips nothing, so requests arrive as /live/homelab.png.
      location /live/ {
        alias /srv/;
        # camo re-fetches on its own schedule; a short max-age at least means a
        # direct visitor is not served a stale image from their own browser.
        add_header Cache-Control "public, max-age=120";
        try_files $uri =404;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-live-image
  namespace: observability-system
  labels:
    app.kubernetes.io/name: grafana-live-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-live-image
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-live-image
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
            - name: images
              mountPath: /srv
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10

        - name: refresher
          image: curlimages/curl:8.11.1
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-renderer-token
                  key: token
          command:
            - sh
            - -c
            - |
              set -u
              RENDERER=http://grafana-image-renderer.observability-system.svc.cluster.local:8081
              GRAFANA=http://grafana-service.observability-system.svc.cluster.local:3000
              TOKEN=563f2abe05d04534af2b73694fc89f0e
              TARGET=$(printf '%s/public-dashboards/%s' "$GRAFANA" "$TOKEN" \
                | sed 's|:|%3A|g; s|/|%2F|g; s|?|%3F|g; s|&|%26|g')
              while true; do
                code=$(curl -s -o /tmp/next.png -w '%{http_code}' \
                  -H "X-Auth-Token: ${AUTH_TOKEN}" \
                  "${RENDERER}/render?url=${TARGET}&encoding=png&width=2200&height=805&deviceScaleFactor=1&timezone=UTC&renderKey=live&domain=grafana-service.observability-system.svc.cluster.local")
                size=$(wc -c < /tmp/next.png)
                magic=$(head -c 4 /tmp/next.png | od -A n -t x1 | tr -d ' \n')
                # Three ways this "succeeds" while being wrong: the renderer
                # answers 200 with a picture of an error card, it defaults to PDF
                # while still sending Content-Type: image/png, and it returns a
                # truncated file when Chromium OOMs. So check the PNG magic bytes
                # and the size, never the status code. A bad render must never
                # replace a good one.
                if [ "$code" = "200" ] && [ "$magic" = "89504e47" ] && [ "$size" -gt 40000 ]; then
                  mv /tmp/next.png /srv/homelab.png
                  echo "refreshed ${size}B"
                else
                  echo "render failed http=${code} magic=${magic} size=${size}, keeping previous" >&2
                fi
                sleep 300
              done
          volumeMounts:
            - name: images
              mountPath: /srv
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: grafana-live-image-nginx
        - name: images
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-live-image
  namespace: observability-system
  labels:
    app.kubernetes.io/name: grafana-live-image
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-live-image
  ports:
    - name: http
      port: 80
      targetPort: http
