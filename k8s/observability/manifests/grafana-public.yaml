# The board behind the public link in the repo README. Everything else in this
# directory is private; this one is deliberately built to be looked at by
# strangers, which drives three rules:
#
#   1. Aggregates only. No node names, pod names, PVCs, database names,
#      hostnames, HTTPRoutes or LAN clients — nothing that enumerates what runs
#      here or how it is addressed. The only `by (...)` clauses left group by a
#      response class or a Flux resource kind, neither of which identifies
#      anything.
#   2. Cheap queries only. A public dashboard runs its queries anonymously on
#      every page load, so this is an unauthenticated compute path into
#      VictoriaMetrics. Everything here is a plain rate or sum over a short
#      window; the series-scanning cardinality panels stay on the private boards.
#   3. No template variables — public dashboards do not support them, and an
#      unresolved variable renders the whole board empty.
#
# Publishing is not declarative: the Grafana operator has no field for it, so the
# share is created once through the API and the resulting token is what the
# README links to. Recreating this cluster from scratch means re-publishing and
# updating that link.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: homelab-public
  namespace: observability-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: "homelab"
  folder: Homelab
  resyncPeriod: 10m
