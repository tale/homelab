apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: postgres
  namespace: observability-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: "homelab"
  folder: Homelab
  resyncPeriod: 10m
  json: |
    {
      "uid": "homelab-postgres",
      "title": "Postgres",
      "tags": [
        "homelab",
        "database"
      ],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "links": [
        {
          "title": "Overview",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-overview",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Storage & Backups",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-storage",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Kubernetes",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-kubernetes",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        }
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Health",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Instances Up",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(cnpg_collector_up)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#ec835a",
                    "value": 1
                  },
                  {
                    "color": "#0ca30c",
                    "value": 2
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Primary",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (pod) (cnpg_pg_replication_in_recovery == 0)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "{{pod}}"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "noValue": "none"
            },
            "overrides": []
          },
          "description": "The instance not in recovery. If two show here, something has gone very wrong; if none do, the cluster has no writable node."
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Streaming Replicas",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(cnpg_pg_replication_streaming_replicas)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#0ca30c",
                    "value": 1
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Replication Slots Active",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(cnpg_pg_replication_slots_active)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#0ca30c",
                    "value": 1
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "description": "An inactive slot still pins WAL on the primary \u2014 that is how a disk fills up after a replica goes away."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Switchover Required",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(cnpg_collector_manual_switchover_required) or vector(0)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "No",
                      "color": "#0ca30c",
                      "index": 0
                    },
                    "1": {
                      "text": "REQUIRED",
                      "color": "#d03b3b",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Fencing",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(cnpg_collector_fencing_on) or vector(0)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Off",
                      "color": "#0ca30c",
                      "index": 0
                    },
                    "1": {
                      "text": "FENCED",
                      "color": "#d03b3b",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Traffic",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Transactions",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(cnpg_pg_stat_database_xact_commit[5m]))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "commit"
            },
            {
              "refId": "B",
              "expr": "sum(rate(cnpg_pg_stat_database_xact_rollback[5m]))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "rollback"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic-by-name"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "pointSize": 8,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "gradientMode": "opacity",
                "axisBorderShow": false,
                "axisColorMode": "text",
                "thresholdsStyle": {
                  "mode": "off"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "commit"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "rollback"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              }
            ]
          },
          "description": "A rollback rate that tracks commits usually means an application is retrying, not that Postgres is unhealthy."
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Connections",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (cnpg_backends_total)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "{{pod}}"
            },
            {
              "refId": "B",
              "expr": "max(cnpg_pg_settings_setting{name=\"max_connections\"})",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "max_connections"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic-by-name"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "pointSize": 8,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "gradientMode": "opacity",
                "axisBorderShow": false,
                "axisColorMode": "text",
                "thresholdsStyle": {
                  "mode": "off"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Tuples",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(cnpg_pg_stat_database_tup_fetched[5m]))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "fetched"
            },
            {
              "refId": "B",
              "expr": "sum(rate(cnpg_pg_stat_database_tup_returned[5m]))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "returned"
            },
            {
              "refId": "C",
              "expr": "sum(rate(cnpg_pg_stat_database_tup_inserted[5m]))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "inserted"
            },
            {
              "refId": "D",
              "expr": "sum(rate(cnpg_pg_stat_database_tup_updated[5m]))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "updated"
            },
            {
              "refId": "E",
              "expr": "sum(rate(cnpg_pg_stat_database_tup_deleted[5m]))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "deleted"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic-by-name"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "pointSize": 8,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "gradientMode": "opacity",
                "axisBorderShow": false,
                "axisColorMode": "text",
                "thresholdsStyle": {
                  "mode": "off"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "fetched"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "returned"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "inserted"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#199e70"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "updated"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#c98500"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "deleted"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d55181"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Cache Hit Ratio",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(cnpg_pg_stat_database_blks_hit[5m])) / clamp_min(sum(rate(cnpg_pg_stat_database_blks_hit[5m])) + sum(rate(cnpg_pg_stat_database_blks_read[5m])), 0.001) * 100",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#ec835a",
                    "value": 95
                  },
                  {
                    "color": "#0ca30c",
                    "value": 99
                  }
                ]
              },
              "mappings": [],
              "decimals": 2
            },
            "overrides": []
          },
          "description": "Below ~99% on a working set this small means shared_buffers is undersized (currently 256MB, set in cluster.yaml)."
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Block I/O",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 6,
            "w": 9,
            "x": 6,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(cnpg_pg_stat_database_blks_hit[5m]))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "cache hits"
            },
            {
              "refId": "B",
              "expr": "sum(rate(cnpg_pg_stat_database_blks_read[5m]))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "disk reads"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic-by-name"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "pointSize": 8,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "gradientMode": "opacity",
                "axisBorderShow": false,
                "axisColorMode": "text",
                "thresholdsStyle": {
                  "mode": "off"
                }
              }
            },
            "overrides": [
              {
