          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": {
                "mode": "palette-classic-by-name"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 0,
                "fillOpacity": 55,
                "showPoints": "never",
                "spanNulls": true,
                "pointSize": 8,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "gradientMode": "opacity",
                "axisBorderShow": false,
                "axisColorMode": "text",
                "thresholdsStyle": {
                  "mode": "off"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Top Pods by CPU",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\",namespace=~\"$namespace\"}[5m])))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
