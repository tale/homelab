          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_deployment_status_replicas_unavailable) + sum(kube_daemonset_status_number_unavailable) + sum(kube_statefulset_status_replicas) - sum(kube_statefulset_status_replicas_ready)",
