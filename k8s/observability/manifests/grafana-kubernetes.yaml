apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes
  namespace: observability-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: "homelab"
  folder: Homelab
  resyncPeriod: 10m
  json: |
    {
      "uid": "homelab-kubernetes",
      "title": "Kubernetes",
      "tags": [
        "homelab",
        "kubernetes"
      ],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "links": [
        {
          "title": "Overview",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-overview",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Network",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-network",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Storage & Backups",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-storage",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": "VictoriaMetrics",
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "namespace"
            },
            "definition": "label_values(kube_pod_info, namespace)",
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "label": "namespace"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Cluster",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Nodes Ready",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#ec835a",
                    "value": 2
                  },
                  {
                    "color": "#0ca30c",
                    "value": 3
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Running Pods",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_status_phase{phase=\"Running\"} == 1)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "palette-classic-by-name"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Not Running",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"} == 1) or vector(0)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 1
                  },
                  {
                    "color": "#d03b3b",
                    "value": 4
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Unavailable Replicas",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_deployment_status_replicas_unavailable) + sum(kube_daemonset_status_number_unavailable) + sum(kube_statefulset_status_replicas) - sum(kube_statefulset_status_replicas_ready)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 1
                  },
                  {
                    "color": "#d03b3b",
                    "value": 3
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "description": "Deployments, DaemonSets and StatefulSets that owe the cluster a pod."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Restarts (1h)",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 1
                  },
                  {
                    "color": "#d03b3b",
                    "value": 10
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "OOMKilled",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_container_status_terminated_reason{reason=\"OOMKilled\"} == 1) or vector(0)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true,
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  },
                  {
                    "color": "#d03b3b",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "description": "Containers whose last exit was the kernel reclaiming their memory."
        },
        {
          "id": 8,
          "type": "row",
          "title": "Workloads",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "CPU by Namespace",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(8, sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\",namespace=~\"$namespace\"}[5m])))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "{{namespace}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic-by-name"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 0,
                "fillOpacity": 55,
                "showPoints": "never",
                "spanNulls": true,
                "pointSize": 8,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "gradientMode": "opacity",
                "axisBorderShow": false,
                "axisColorMode": "text",
                "thresholdsStyle": {
                  "mode": "off"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Memory by Namespace",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(8, sum by (namespace) (container_memory_working_set_bytes{container!=\"\",namespace=~\"$namespace\"}))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "{{namespace}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
