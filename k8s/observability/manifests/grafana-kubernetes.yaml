          },
          "description": "Seconds per second a container spent frozen against its CPU limit."
        },
        {
          "id": 14,
          "type": "table",
          "title": "Restarting Containers (24h)",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(15, sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[24h])) > 0)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": false,
              "format": "table",
              "instant": true
            }
          ],
          "options": {
            "showHeader": true,
            "footer": {
              "show": false
            },
            "cellHeight": "sm"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": false,
                "minWidth": 130
              },
              "noValue": "No container restarts in 24h"
            },
            "overrides": []
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true
                },
                "renameByName": {
                  "Value": "restarts"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "restarts",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "description": "Empty is the correct state."
        },
        {
          "id": 15,
          "type": "row",
          "title": "Capacity",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "panels": []
        },
        {
          "id": 16,
          "type": "bargauge",
          "title": "Pod Slots Used per Node",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by (node) (kube_pod_info) / max by (node) (kube_node_status_allocatable{resource=\"pods\"}) * 100",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "{{node}}"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "minVizWidth": 8,
            "minVizHeight": 16,
            "valueMode": "color",
            "namePlacement": "auto",
