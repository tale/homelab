          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"} == 1) or vector(0)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
