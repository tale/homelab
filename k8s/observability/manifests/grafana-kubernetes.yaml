                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "CPU Throttling",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (namespace, pod) (rate(container_cpu_cfs_throttled_seconds_total{container!=\"\",namespace=~\"$namespace\"}[5m])))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
