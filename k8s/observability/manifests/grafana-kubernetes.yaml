                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "pointSize": 8,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "gradientMode": "opacity",
                "axisBorderShow": false,
                "axisColorMode": "text",
                "thresholdsStyle": {
                  "mode": "off"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Top Pods by Memory",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\",namespace=~\"$namespace\"}))",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true,
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
