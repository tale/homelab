# Hand-written, replacing the Kubernetes Views boards (grafana.com 15757/15760).
# Those spent half their panels on `windows_*` metrics this cluster will never
# emit, and keyed the rest on kube-prometheus recording rules that vanished when
# `defaultRules` was turned off in helmrelease.yaml.
#
# There are no per-pod network panels here on purpose:
# `container_network_*_packets|errors|dropped` are dropped at scrape time, and
# the byte counters that survive are already on the Network board with better
# labels.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes
  namespace: observability-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: "homelab"
  folder: Kubernetes
  resyncPeriod: 10m
  json: |
    {
      "uid": "homelab-kubernetes",
      "title": "Kubernetes",
      "tags": [
        "homelab",
        "kubernetes"
      ],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "links": [
        {
          "title": "Overview",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-overview",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Network",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-network",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Storage & Backups",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-storage",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": "VictoriaMetrics",
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "namespace"
            },
            "definition": "label_values(kube_pod_info, namespace)",
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "label": "namespace"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Cluster",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Nodes Ready",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Running Pods",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_status_phase{phase=\"Running\"} == 1)",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 4,
