                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "description": "Deployments, DaemonSets and StatefulSets that owe the cluster a pod."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Restarts (1h)",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
