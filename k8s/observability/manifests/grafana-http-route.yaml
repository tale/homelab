apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability-system
spec:
  parentRefs:
    - name: envoy-gw
      sectionName: https
      namespace: default
  hostnames:
    - grafana.tale.me
  rules:
    # `/live/homelab.png` is the image embedded in the repo README, so it has to
    # answer without Authentik in front of it. It is a rendered PNG of the public
    # dashboard and nothing else — the nginx behind it serves that one directory
    # and 404s everything else.
    #
    # Gateway API resolves the longest matching prefix first, so this wins over
    # the catch-all below regardless of the order they appear in.
    - matches:
        - path:
            type: PathPrefix
            value: /live/
      backendRefs:
        - name: grafana-live-image
          port: 80
    - backendRefs:
        - name: grafana-service
          port: 3000
