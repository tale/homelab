# Hand-written because no community dashboard knows what matters in this
# cluster. Everything else under observability/ is imported by grafana.com ID at
# a pinned revision; this is the one screen that is ours.
#
# Regenerate with scratch/build-overview.py if the panel set changes — the JSON
# below is generated, but it is committed so Flux has no build step.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: homelab-overview
  namespace: observability-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: "homelab"
  folder: Homelab
  resyncPeriod: 10m
  json: |
