          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-postgres",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Monitoring",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-monitoring",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        }
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Health",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Nodes Ready",
          "datasource": "VictoriaMetrics",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "datasource": "VictoriaMetrics",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
