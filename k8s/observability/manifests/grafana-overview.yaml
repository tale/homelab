# Hand-written: the one screen that answers "is anything wrong, and where".
# Everything here is either a number that should never move (nodes ready, certs,
# backups) or the first place a real problem shows up. Depth lives in the boards
# linked across the top — this one deliberately does not scroll far.
#
# Node panels aggregate `by (node)`. That label only exists on node-exporter
# because helmrelease.yaml relabels it in; without it these panels key on an
# IP:port and join nothing else in the cluster.
#
# Ingress panels read the Envoy Gateway *data plane*, scraped by the VMPodScrape
# in k8s/infra/configs/envoy/service-monitor.yaml. `https-10443` is the real
# listener; the other conn_manager prefixes are Envoy's own admin endpoints.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: homelab-overview
  namespace: observability-system
spec:
  instanceSelector:
    matchLabels:
      dashboards: "homelab"
  folder: Homelab
  resyncPeriod: 10m
  json: |
    {
      "uid": "homelab-overview",
      "title": "Homelab Overview",
      "tags": [
        "homelab"
      ],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "links": [
        {
          "title": "Kubernetes",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-kubernetes",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Network",
          "type": "link",
          "asDropdown": false,
          "tags": [],
          "targetBlank": false,
          "url": "/d/homelab-network",
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "tooltip": ""
        },
        {
          "title": "Storage & Backups",
