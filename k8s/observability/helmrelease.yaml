apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: observability-system
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.87.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  install:
    createNamespace: true
  upgrade:
    serverSideApply: enabled
  rollback:
    serverSideApply: enabled
  values:
    grafana:
      enabled: false
    defaultDashboards:
      enabled: false
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "90d"
        storage:
          storageClassName: cluster-nvmf
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 150Gi
    vmagent:
      enabled: true
      spec:
        scrapeInterval: 30s
        selectAllByDefault: true
        # Dashboards and rules from the wider ecosystem assume a cluster label
        # exists; without one every `cluster` template variable renders empty.
        externalLabels:
          cluster: homelab
        extraArgs:
          promscrape.streamParse: "true"
        # Three nodes were producing 487k active series, 69% of it apiserver
        # and kubelet histogram buckets nobody queries. Dropping `_bucket`
        # keeps `_count` and `_sum`, so rates and averages still work — only
        # quantile estimation is lost.
        globalScrapeMetricRelabelConfigs:
          - action: drop
            source_labels: [__name__]
            regex: >-
              (apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_events_sizes|apiserver_watch_cache_read_wait_seconds|etcd_request_duration_seconds)_bucket
          - action: drop
            source_labels: [__name__]
            regex: >-
              (rest_client_request_duration_seconds|rest_client_rate_limiter_duration_seconds|workqueue_queue_duration_seconds|workqueue_work_duration_seconds|controller_runtime_reconcile_time_seconds|prober_probe_duration_seconds)_bucket
          # Per-pod, per-interface counters. Bytes are kept for the traffic
          # graphs; packet, error and drop variants are six more series each
          # and have never once been the thing that answered a question.
          - action: drop
            source_labels: [__name__]
            regex: >-
              container_network_(receive|transmit)_(packets|errors|packets_dropped)_total
          - action: drop
            source_labels: [__name__]
            regex: container_tasks_state|container_memory_failures_total
    vmalert:
      enabled: true
      spec:
        evaluationInterval: 30s
        selectAllByDefault: true
        extraArgs:
          external.url: https://grafana.tale.me
          external.alert.source: 'explore?orgId=1&left={"datasource":"VictoriaMetrics","queries":[{"expr":{{ "{{" }}.Expr|jsonEscape|queryEscape{{ "}}" }},"refId":"A"}],"range":{"from":"{{ "{{" }} .ActiveAt.UnixMilli {{ "}}" }}","to":"now"}}'
    alertmanager:
      enabled: true
      spec:
        externalURL: https://grafana.tale.me
        configSecret: ""
        secrets:
          - pushover-credentials
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: cluster-nvmf
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
      config:
        route:
          # Anything matching no child route lands here, so this has to be the
          # drop target — naming pushover made the severity matcher below a
          # no-op and paged every info-level alert.
          receiver: blackhole
          group_by: ["alertname", "cluster"]
          group_wait: 1m
          group_interval: 5m
          repeat_interval: 24h
          routes:
            - receiver: pushover-page
              matchers:
                - severity = "critical"
              group_wait: 30s
              repeat_interval: 4h
            # Warnings collapse into a single digest message and stay quiet
            # overnight — none of them are worth waking up for.
            - receiver: pushover-notify
              matchers:
                - severity = "warning"
              group_by: ["cluster"]
              group_wait: 5m
              group_interval: 1h
              repeat_interval: 24h
              mute_time_intervals:
                - overnight
        time_intervals:
          - name: overnight
            time_intervals:
              - location: America/New_York
                times:
                  - start_time: "23:00"
                    end_time: "24:00"
                  - start_time: "00:00"
                    end_time: "08:00"
        inhibit_rules:
          # A dead node cascades into every pod-level warning in the cluster;
          # this is what turned one flapping node into 65 notifications. With
          # three nodes, suppressing warnings globally is the right call.
          - source_matchers:
              - alertname =~ "NodeDown|NodeNotReady"
            target_matchers:
              - severity = "warning"
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity = "warning"
            equal: ["alertname", "namespace"]
        receivers:
          - name: blackhole
          - name: pushover-page
            pushover_configs:
              - user_key_file: /etc/vm/secrets/pushover-credentials/user_key
                token_file: /etc/vm/secrets/pushover-credentials/api_token
                priority: 1
                title: "{{ .CommonLabels.alertname }}"
                message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ if .Annotations.description }}{{ "\n" }}{{ .Annotations.description }}{{ end }}{{ "\n" }}{{ end }}'
                url: "{{ (index .Alerts 0).GeneratorURL }}"
          - name: pushover-notify
            pushover_configs:
              - user_key_file: /etc/vm/secrets/pushover-credentials/user_key
                token_file: /etc/vm/secrets/pushover-credentials/api_token
                priority: -1
                title: "{{ .Alerts.Firing | len }} warning(s)"
                message: '{{ range .Alerts }}{{ .Labels.alertname }}: {{ .Annotations.summary }}{{ "\n" }}{{ end }}'
                url: https://grafana.tale.me
    # kube-prometheus' ruleset is written for a multi-tenant production fleet.
    # On three nodes it produced 79 simultaneous alerts and four rounds of
    # per-rule patching that never converged. Everything worth paging on is
    # hand-written in manifests/vmrules.yaml instead.
    #
    # This also drops the chart's recording rules, which the Kubernetes Views
    # dashboards depend on. Those are already broken and get replaced.
    defaultRules:
      enabled: false
    victoria-metrics-operator:
      crds:
        enabled: false
        plain: false
      operator:
        # Charts render ServiceMonitor/PodMonitor; the converter turns those into
        # VMServiceScrape/VMPodScrape so chart upgrades carry their own scrape
        # config instead of silently breaking a hand-written CR.
        disable_prometheus_converter: false
        # Owner-reference converted objects to their source, so deleting a
        # ServiceMonitor garbage-collects the VMServiceScrape it produced. Set
        # through the chart's own key — adding the equivalent env var by hand
        # collides with the one the chart already renders and SSA rejects the
        # whole Deployment.
        enable_converter_ownership: true
      env:
        # The ScrapeConfig CRD is deliberately not installed.
        - name: VM_ENABLEDPROMETHEUSCONVERTER_SCRAPECONFIG
          value: "false"
    prometheus-node-exporter:
      enabled: true
    kube-state-metrics:
      enabled: true
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    coreDns:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: logs-collector
  namespace: observability-system
spec:
  dependsOn:
    - name: victoria-metrics-k8s-stack
  interval: 1h
  chart:
    spec:
      chart: victoria-logs-collector
      version: 0.3.7
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  upgrade:
    serverSideApply: enabled
  rollback:
    serverSideApply: enabled
  values:
    remoteWrite:
      - url: http://vlsingle-vlogs.observability-system.svc.cluster.local:9428
