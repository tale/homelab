name: rpi-image

on:
  workflow_dispatch:
  push:
    paths:
      - "rpi/**"
      - ".github/workflows/rpi-image.yml"

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  nut:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build rpi-image-gen
        run: docker build -t rpi-image-gen -f rpi/Containerfile rpi

      - name: Build NUT image
        run: |
          docker run --rm --privileged -v "$PWD/rpi:/rpi" rpi-image-gen \
            sh -c 'rpi-image-gen build -S /rpi -c /rpi/config.yaml \
              && cp /build/work/deploy-*/nut.img.zst /rpi/nut.img.zst'

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nut-img
          path: rpi/nut.img.zst
          retention-days: 14
