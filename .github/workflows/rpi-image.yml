name: rpi image

on:
  workflow_dispatch:
  push:
    paths:
      - "rpi/**"
      - ".github/workflows/rpi-image.yml"

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  nut:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the rpi-image-gen builder
        run: docker build -t rpi-image-gen -f rpi/Containerfile rpi

      - name: Build the NUT image
        run: |
          docker run --rm --privileged -v "$PWD/rpi:/rpi" rpi-image-gen \
            sh -c 'rpi-image-gen build -S /rpi/nut -c /rpi/nut/config.yaml \
              && cp /build/work/image-nut/nut.img /rpi/nut/nut.img'

      - name: Compress the image
        run: xz -T0 -3 rpi/nut/nut.img

      - name: Upload the image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nut-img
          path: rpi/nut/nut.img.xz
          retention-days: 14
