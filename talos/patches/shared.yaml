machine:
  kubelet:
    extraArgs:
      rotate-server-certificates: true

  network:
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
      - 1.0.0.1
      - 8.8.4.4

  install:
    wipe: false

  time:
    disabled: false
    servers:
      - time.cloudflare.com
      - time.google.com
      - 0.north-america.pool.ntp.org
      - 1.north-america.pool.ntp.org
      - 2.north-america.pool.ntp.org
      - 3.north-america.pool.ntp.org
    bootTimeout: 2m0s

  sysctls:
    kernel.domainname: talos.dev
    net.ipv4.ip_forward: "1"
    net.ipv6.conf.all.forwarding: "1"

  # Talos 1.13 labels control-plane nodes as excluded from external load
  # balancers. MetalLB honours that label, and every node here is a
  # control-plane node, so leaving it on kills every LoadBalancer service.
  nodeLabels:
    # `$$` escapes talhelper's own `${VAR}` interpolation down to a literal `$`.
    node.kubernetes.io/exclude-from-external-load-balancers:
      $$patch: delete

cluster:
  # Make `kubectl top` work out of the box.
  extraManifests:
    - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
    - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
