ipam:
  mode: kubernetes
kubeProxyReplacement: true
operator:
  replicas: 1
  prometheus:
    metricsService: true
prometheus:
  enabled: true
  metricsService: true
hubble:
  enabled: true
  # Relay and the UI are gone, so nothing dials the Hubble gRPC API. Closing the
  # listener is what makes disabling its TLS safe — the chart's warning is about
  # `listenAddress` being reachable on the host network — and it keeps the
  # rendered manifest free of the key material `genCA` would otherwise inline.
  listenAddress: ""
  tls:
    enabled: false
  relay:
    enabled: false
  ui:
    enabled: false
  metrics:
    enabled:
      # Drops are the only flow metric worth labelling by workload: it is the
      # one question the UI used to answer that a bare counter cannot.
      - "drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace"
      - flow
      - tcp
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServiceHost: localhost
k8sServicePort: 7445
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
